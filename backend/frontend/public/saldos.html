<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>MooneyMaker • Saldos</title>
  <link rel="stylesheet" href="styles.css?v=2026010522"/>
  <style>
    /* Ajustes de espaciado para que app-nosidebar no ocupe espacio excesivo */
    .app-nosidebar > main.content-wrap {
      padding-top: 0 !important;
    }
    .app-nosidebar .card { margin-top: 8px; }
    /* Evita espaciados grandes en pantallas altas */
    @media (min-height: 800px) {
      .app-nosidebar > main.content-wrap { padding-bottom: 0 !important; }
    }
  </style>
</head>

<body>
  <div class="app-nosidebar">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          <span class="brand">MooneyMaker</span>
        </div>
        <button class="hamburger" id="hamburgerBtn" aria-label="Abrir menú" aria-expanded="false"><span></span><span></span><span></span></button>
        <nav class="topbar-center nav-desktop">
          <a href="egreso.html" class="nav-item">Retiros</a>
          <a href="consulta-egresos.html" class="nav-item">Historial</a>
          <a href="flujo-usd.html" class="nav-item">Flujo USD</a>
          <a href="saldos.html" class="nav-item active" data-admin-only="1">Saldos</a>
          <a href="usuarios.html" class="nav-item" data-admin-only="1">Usuarios</a>
          <a href="logs.html" class="nav-item" data-requires-encargado="1">Logs</a>
        </nav>
        <div class="topbar-right nav-desktop">
          <button id="themeToggle" class="btn-theme" aria-label="Cambiar tema" title="Cambiar tema">🌙</button>
          <span id="whoami" class="user-badge">—</span>
          <button id="logoutBtn" class="btn-logout">Salir</button>
        </div>
      </div>
    </header>

    <div class="drawer-overlay" id="drawerOverlay"></div>
  </div>

  <!-- CONTENT -->
  <main class="content-wrap">
    <div class="page">

      <section class="card">
        <div class="card-header">Saldos de Cuentas en Tiempo Real</div>
        <div class="card-body">
          <form id="filtrosSaldos" class="grid" onsubmit="return false;">
            <div class="field span4">
              <label>EMPRESA</label>
              <select id="filtro_empresa">
                <option value="">Todas</option>
              </select>
            </div>
            <div class="field span4">
              <label>CUENTA</label>
              <select id="filtro_cuenta" disabled>
                <option value="">Todas</option>
              </select>
            </div>
            <div class="field span4">
              <label>MONEDA</label>
              <select id="filtro_moneda">
                <option value="">Todas</option>
                <option value="ARS">ARS</option>
                <option value="USD">USD</option>
              </select>
            </div>
            <div class="field span2" style="align-self:flex-end;">
              <label>&nbsp;</label>
              <button id="btnCargarSaldos" class="btn btn-primary" type="button">Cargar saldos</button>
            </div>
          </form>
        </div>
      </section>

      <!-- SALDOS ARS -->
      <section class="card" id="saldosARSSection" style="margin-top: 20px;">
        <div class="card-header">ARS - Cuentas</div>
        <div class="card-body">
          <div class="table-wrap">
            <table class="table" id="saldosTableARS">
              <thead>
                <tr>
                  <th>Empresa</th>
                  <th>Cuenta</th>
                  <th>Saldo</th>
                  <th>Última Transacción</th>
                  <th>Transacciones</th>
                </tr>
              </thead>
              <tbody><tr><td colspan="5" class="muted">Cargá saldos para ARS</td></tr></tbody>
            </table>
          </div>
          <div class="note" id="totalARS" style="margin-top:8px; font-weight:600; color: var(--green);"></div>
        </div>
      </section>

      <!-- SALDOS USD -->
      <section class="card" id="saldosUSDSection" style="margin-top: 20px;">
        <div class="card-header">USD - Cuentas</div>
        <div class="card-body">
          <div class="table-wrap">
            <table class="table" id="saldosTableUSD">
              <thead>
                <tr>
                  <th>Empresa</th>
                  <th>Cuenta</th>
                  <th>Saldo</th>
                  <th>Última Transacción</th>
                  <th>Transacciones</th>
                </tr>
              </thead>
              <tbody><tr><td colspan="5" class="muted">Cargá saldos para USD</td></tr></tbody>
            </table>
          </div>
          <div class="note" id="totalUSD" style="margin-top:8px; font-weight:600; color: var(--blue);"></div>
        </div>
      </section>

    </div>
  </main>

  <!-- MODAL DETALLE DE TRANSACCIONES -->
  <div id="detalleModal" class="modal" style="display:none;" aria-label="Detalle de cuenta" aria-modal="true" role="dialog">
    <div class="modal-backdrop" onclick="cerrarModal()"></div>
    <div class="modal-content">
      <div class="card-header" style="display:flex; justify-content:space-between; align-items:center;">
        <span id="detalleModalTitle">Transacciones</span>
        <button type="button" class="btn-close" onclick="cerrarModal()">✕</button>
      </div>
      <div id="detalleBody" style="padding: 16px; max-height:60vh; overflow:auto;"></div>
    </div>
  </div>

  <script src="app.js?v=2026010522"></script>
</body>
</html>
