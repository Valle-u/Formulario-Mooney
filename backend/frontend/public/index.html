<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>MooneyMaker • Login</title>
  <!-- Build: 2026-01-02-23-03-19 -->
  <link rel="stylesheet" href="styles.css?v=AUTO"/>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-body">
        <div class="login-icon">MM</div>
        <h3 class="login-title">Ingrese a su cuenta</h3>

        <form id="loginForm">
          <div class="login-field">
            <div class="input">
              <span>USR</span>
              <input id="username" type="text" placeholder="usuario" autocomplete="username" required>
            </div>
            <div id="username_error" class="field-error login-field-error" style="display:none;" role="alert"></div>
          </div>

          <div class="login-field">
            <div class="input login-input-password">
              <span>KEY</span>
              <input id="password" type="password" placeholder="contraseña" autocomplete="current-password" required>
              <button type="button" class="password-toggle" data-target="password" title="Mostrar/Ocultar contraseña" aria-label="Mostrar u ocultar contraseña">
                VER
              </button>
            </div>
            <div id="password_error" class="field-error login-field-error" style="display:none;" role="alert"></div>
          </div>

          <label class="remember-login" for="rememberMe">
            <input type="checkbox" id="rememberMe">
            Recordar credenciales
          </label>

          <button class="btn btn-primary" type="submit">Iniciar sesión</button>
          <p class="note" style="text-align:center;margin-top:12px">
          </p>
        </form>
      </div>
    </div>

    <!-- Container para toast notifications -->
    <div id="toastContainer" class="toast-container"></div>
  </div>

  <script src="app-shared.js?v=AUTO"></script>
</body>
</html>
