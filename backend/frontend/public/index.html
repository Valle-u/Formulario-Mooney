<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>MooneyMaker • Login</title>
  <!-- Build: 2026-01-02-23-03-19 -->
  <link rel="stylesheet" href="styles.css?v=2026030104"/>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-body">
        <div class="login-icon">MM</div>
        <h3 class="login-title">Ingrese a su cuenta</h3>

        <form id="loginForm">
          <div class="input">
            <span>USR</span>
            <input id="username" type="text" placeholder="usuario" autocomplete="username" required>
          </div>

          <div class="input" style="position: relative;">
            <span>KEY</span>
            <input id="password" type="password" placeholder="contraseña" autocomplete="current-password" required style="padding-right: 45px;">
            <button type="button" class="password-toggle" data-target="password" title="Mostrar/Ocultar contraseña" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 11px; padding: 4px; opacity: 0.6; transition: opacity 0.2s; font-weight: 700; letter-spacing: .3px;">
              VER
            </button>
          </div>

          <button class="btn btn-primary" type="submit">Iniciar sesión</button>
          <p class="note" style="text-align:center;margin-top:12px">
          </p>
        </form>
      </div>
    </div>

    <!-- Container para toast notifications -->
    <div id="toastContainer" class="toast-container"></div>
  </div>

  <script src="app-shared.js?v=20260227"></script>
</body>
</html>
